# EDA Playground SPA + reverse proxy to Playground.Api (compose service "playground-api").
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API at request time via Docker's DNS, so nginx starts even
    # when playground-api is not up yet (the UI then shows "Reconnecting…").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $playground_api http://playground-api:8080;

    location /api/ {
        proxy_pass $playground_api;

        # SSE-safe: keep the connection open and flush every event immediately.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths serve index.html (never cached).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
