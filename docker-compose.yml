name: kafka-eda-study

x-dotnet-env: &dotnet-env
  Kafka__BootstrapServers: kafka:29092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

services:
  # ---------- infra ----------
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["./infra/create-topics.sh:/create-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    ports:
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP gRPC, for services run from the IDE
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

  # ---------- services (added step by step) ----------
  orders-api:
    build: { context: ., args: { PROJECT: Orders.Api } }
    ports: ["5001:8080"]
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: orders-api
      ConnectionStrings__Orders: Host=postgres;Database=orders;Username=postgres;Password=postgres
    depends_on: &app-deps
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  inventory-worker:
    build: { context: ., args: { PROJECT: Inventory.Worker } }
    # Step 3: three replicas in one consumer group share the 3 partitions of orders.events.
    # Stop one (docker compose stop / docker kill) and watch the rebalance in the Playground.
    deploy: { replicas: 3 }
    restart: on-failure
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: inventory-worker
      ConnectionStrings__Inventory: Host=postgres;Database=inventory;Username=postgres;Password=postgres
    depends_on: *app-deps

  notifications-worker:
    build: { context: ., args: { PROJECT: Notifications.Worker } }
    ports: ["5004:8080"]   # GET /notifications
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: notifications-worker
      ConnectionStrings__Notifications: Host=postgres;Database=notifications;Username=postgres;Password=postgres
    depends_on: *app-deps

  payments-worker:
    build: { context: ., args: { PROJECT: Payments.Worker } }
    restart: on-failure
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: payments-worker
      ConnectionStrings__Payments: Host=postgres;Database=payments;Username=postgres;Password=postgres
    depends_on: *app-deps

  shipping-api:
    build: { context: ., args: { PROJECT: Shipping.Api } }
    ports: ["5002:8080"]   # POST /shipments/{orderId}/dispatch and /deliver
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: shipping-api
      ConnectionStrings__Shipping: Host=postgres;Database=shipping;Username=postgres;Password=postgres
    depends_on: *app-deps

  playground-api:
    build: { context: ., args: { PROJECT: Playground.Api } }
    ports: ["5003:8080"]
    environment:
      <<: *dotnet-env
      OTEL_SERVICE_NAME: playground-api
      Services__OrdersApi: http://orders-api:8080
      Services__ShippingApi: http://shipping-api:8080
    depends_on: *app-deps

  playground-web:
    build: { context: src/Playground.Web }
    ports: ["3000:80"]
    depends_on:
      playground-api: { condition: service_healthy }

volumes:
  pgdata:
